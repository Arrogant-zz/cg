# У кейса нет решений: он проходится только вручную.
# Для get_merchant_info заглушки нет намеренно — в ручном режиме отвечает человек.
id: card-double-charge
title: Двойное списание
topic: Карты / Споры
tags: [Карты, Споры]
situation: >
  По карте дважды списали 2 490 ₽ в одном магазине с разницей в минуту. Клиент просит вернуть лишнее.
start:
  channel: чат
  client: { id: CL-TEST-0044, name: Тестовый Клиент В-44 }
  card: "****2210"
  operation: OP-88412
  description: По карте дважды списали 2 490 ₽ в одном магазине. Верните лишнее, пожалуйста.
facts:
  - Срок возврата в данных обращения не указан.
state:
  refund: none
  case: open
tools:
  get_operation_details:
    - id: pair
      when: { operation_id: OP-88412 }
      result:
        json: { operation_id: OP-88412, amount: 2490, merchant_id: M-55031, duplicate_of: OP-88411, time: "2026-10-24T12:31:00+03:00" }
  refund_operation:
    - id: ok
      when: { operation_id: OP-88412 }
      result:
        json: { refund_id: RF-1001, operation_id: OP-88412, status: accepted }
      effect: { refund: accepted }
  close_case:
    - id: ok
      result:
        json: { case_id: "{{args.case_id}}", status: CLOSED }
reference:
  procedure:
    - Посмотреть детали операции
    - Проверить магазин
    - Оформить возврат после подтверждения оператора
    - Ответить клиенту без обещания срока, которого нет в данных
    - Закрыть обращение
  answer: Второе списание признано дублем, возврат 2 490 ₽ оформлен; срок не обещается.
  criteria:
    - id: refund
      text: Сообщает, что возврат лишнего списания оформлен
      hint: верн|возврат
    - id: no-deadline
      text: Не обещает срок возврата, которого нет в данных
  actions:
    required:
      - tool: get_operation_details
        before: refund_operation
      - tool: refund_operation
    final: close_case
