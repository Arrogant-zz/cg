# Синтетический кейс. Поля start — условные: реальные берутся из шаблона стартового сообщения оркестратора.
id: card-blocked-wrong-pin
title: Карта заблокирована после неверных PIN
topic: Карты / Блокировка
tags: [Карты, PIN, Блокировка]
situation: >
  Клиент трижды ввёл неверный PIN, карта заблокирована. Клиент просит разблокировать её в чате.
  Подозрительных операций по карте нет.
start:
  channel: чат
  client: { id: CL-TEST-0017, name: Тестовый Клиент А-17 }
  card: "****4417"
  description: Карта перестала работать после того, как я несколько раз ввёл PIN в банкомате. Разблокируйте, пожалуйста.
facts:
  - Клиент вводил PIN в банкомате у дома, карту не терял.
  - PIN-код не менялся больше года.
state:
  card: blocked
  case: open
tools:
  get_card_status:
    - id: blocked-pin
      when: { card: "****4417" }
      result:
        json: { card: "****4417", status: "{{state.card}}", reason: pin_attempts, attempts: 3 }
  get_client_profile:
    - id: default
      result: { file: clients/a-17.json }
  get_recent_operations:
    - id: no-fraud
      when: { card: "****4417" }
      result: { file: operations/no-fraud.json }
  unblock_card:
    - id: ok
      when: { card: "****4417" }
      sequence:
        - result:
            json: { card: "****4417", status: active }
          effect: { card: active }
        - error: { message: already_active, code: CARD_ALREADY_ACTIVE }
  close_case:
    - id: ok
      delayMs: 1200
      result:
        json: { case_id: "{{args.case_id}}", status: CLOSED }
      effect: { case: closed }
reference:
  procedure:
    - Проверить статус карты
    - Проверить последние операции по карте
    - Разблокировать карту после подтверждения оператора
    - "Ответить клиенту: карта разблокирована, лучше сменить PIN"
    - Закрыть обращение
  answer: Карта разблокирована; подозрительных операций нет; клиенту рекомендовано сменить PIN-код.
  criteria:
    - id: unblocked
      text: Сообщает клиенту, что карта разблокирована
      hint: разблокирован
    - id: change-pin
      text: Советует сменить PIN
      hint: сменить PIN
      lesson: L-cards-005
    - id: no-promises
      text: Не обещает того, чего нет в данных кейса
  actions:
    required:
      - tool: get_recent_operations
        before: unblock_card
        lesson: L-cards-004
      - tool: unblock_card
    forbidden:
      - tool: reissue_card
        lesson: L-cards-006
    final: close_case
  lessons:
    - id: L-cards-004
      rule: Перед разблокировкой посмотреть последние операции по карте.
    - id: L-cards-005
      rule: В ответе клиенту посоветовать сменить PIN-код.
    - id: L-cards-006
      rule: Карту не перевыпускаем, если её можно разблокировать.
