id: card-reissue-lost
title: Перевыпуск утерянной карты
topic: Карты / Перевыпуск
tags: [Карты, Перевыпуск]
situation: >
  Клиент потерял карту и сам заблокировал её в приложении. Нужна новая карта с доставкой.
start:
  channel: чат
  client: { id: CL-TEST-0031, name: Тестовый Клиент Б-31 }
  card: "****2208"
  description: Потерял карту, заблокировал её в приложении. Нужна новая.
facts:
  - Доставка возможна по адресу из профиля клиента.
state:
  card: blocked_lost
  reissue: none
  case: open
tools:
  get_card_status:
    - id: lost
      when: { card: "****2208" }
      result:
        json: { card: "****2208", status: blocked, reason: lost_by_client }
  get_client_profile:
    - id: b-31
      when: { client_id: CL-TEST-0031 }
      result:
        json: { client_id: CL-TEST-0031, name: Тестовый Клиент Б-31, delivery_address: "г. Тестовый, ул. Примерная, д. 31" }
  reissue_card:
    - id: ordered
      when: { card: "****2208" }
      result:
        json: { card: "****2208", status: reissue_ordered, ready_in_days: 5 }
      effect: { reissue: ordered }
  unblock_card:
    - id: lost-error
      error: { message: card_lost_cannot_unblock, code: CARD_LOST }
  close_case:
    - id: ok
      result:
        json: { case_id: "{{args.case_id}}", status: CLOSED }
      effect: { case: closed }
reference:
  procedure:
    - Проверить статус карты
    - Уточнить адрес доставки в профиле клиента
    - Перевыпустить карту после подтверждения оператора
    - "Ответить клиенту: карта перевыпущена, срок — 5 рабочих дней"
    - Закрыть обращение
  answer: Карта перевыпущена с доставкой по адресу из профиля; новая карта будет готова через 5 рабочих дней.
  criteria:
    - id: reissued
      text: Сообщает, что карта перевыпущена
      hint: перевыпущ
    - id: deadline
      text: Называет срок готовности новой карты
      hint: рабочих дней
      lesson: L-cards-011
  actions:
    required:
      - tool: get_client_profile
        before: reissue_card
        lesson: L-cards-010
      - tool: reissue_card
    forbidden:
      - tool: unblock_card
        lesson: L-cards-012
    final: close_case
  lessons:
    - id: L-cards-010
      rule: Перед перевыпуском уточнить адрес доставки в профиле клиента.
    - id: L-cards-011
      rule: В ответе называть срок перевыпуска — 5 рабочих дней.
    - id: L-cards-012
      rule: Утерянную карту не разблокируем, только перевыпускаем.
