# LLM-оператор через OpenAI-совместимый шлюз контура. Адрес, ключ и имя модели — из окружения.
id: op-a
title: op-a
roles: [operator]
provider: openai-compatible
baseUrl: ${env:LLM_BASE_URL}
apiKey: ${env:LLM_API_KEY}
model: ${env:LLM_OPERATOR_MODEL}
params:
  temperature: 0.3
  maxTokens: 4000
  timeoutMs: 120000
  retries: 2
  responseFormat: json_schema
