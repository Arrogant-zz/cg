# Встроенные расчёты (MET-01) и метрики аналитика M1, M2. Пользовательские формулы — позднее.
metrics:
  - id: action-checks
    builtin: action-checks
    title: Проверки действий
    description: Обязательные выполнены, запрещённые не вызваны; события-доказательства сохраняются
    unit: кейсы
    level: [кейс, корзина]
    needs: журнал инструментов
    version: v1
  - id: answer-quality
    builtin: answer-quality
    title: Качество ответа
    description: Вердикт LLM по критериям эталона с объяснением каждого непройденного
    unit: критерии
    level: [кейс]
    needs: ответ, эталон, вызов судьи
    version: v1
  - id: success
    builtin: success
    title: Итоговый успех
    description: Все обязательные проверки пройдены; без оценки — «не оценено», а не неуспех
    unit: кейсы
    level: [кейс, корзина]
    needs: обе проверки
    version: v1
  - id: corrections
    builtin: corrections
    title: Поправки оператора
    description: Обучающие поправки оператора или человека; один урок в кейсе считается один раз; сбои оператора — отдельно
    unit: поправки
    level: [кейс, корзина]
    needs: разметка оператора
    version: v1
  - id: repeated-corrections
    builtin: repeated-corrections
    title: Повторные поправки
    description: Известный урок снова встречается в той же линии обучения
    unit: поправки
    level: [корзина]
    needs: идентификаторы уроков
    version: v1
  - id: rejected-actions
    builtin: rejected-actions
    title: Отклонённые действия
    description: Отклонения подтверждений; отклонения по таймауту — отдельно
    unit: вызовы
    level: [кейс, корзина]
    needs: подтверждения
    version: v1
  - id: unexpected-tools
    builtin: unexpected-tools
    title: Неожиданные инструменты
    description: Вызовы без подходящей заглушки; не смешиваются с запрещёнными
    unit: вызовы
    level: [кейс, корзина]
    needs: журнал инструментов
    version: v1
  - id: turns-duration
    builtin: turns-duration
    title: Длительность
    description: Ходы диалога и время по ролям — агент, оператор, судья, команды
    unit: время
    level: [кейс, корзина]
    needs: метки времени
    version: v1
  - id: tokens
    builtin: tokens
    title: Токены
    description: По ролям, если источник отдаёт usage; иначе «нет данных»
    unit: токены
    level: [кейс, корзина]
    needs: usage в ответах
    version: v1
  - id: skill-changes
    builtin: skill-changes
    title: Изменения скиллов
    description: Созданные, изменённые и удалённые файлы после каждого curator и за прогон; в проверке — неизменность набора
    unit: файлы
    level: [прогон]
    needs: файлы набора до и после
    version: v1
  - id: operator-errors
    builtin: operator-errors
    title: Сбои LLM-оператора
    description: Ошибки модели и формата, таймауты и нарушения режима — отдельно от неуспеха агента
    unit: случаи
    level: [кейс, корзина]
    needs: вызовы LLM-оператора
    version: v1
  # Метрики аналитика (документ «Аналитика оценки качества обучения агента», ред. 22.10.2026; приняты владельцем 27.10.2026).
  # Сравниваются ΔM1 и ΔM2 на одном тестовом датасете до и после обучения; сводить их в одно число не нужно.
  - id: final-action
    builtin: final-action
    title: M1 · Финальное действие
    description: macro-F1 по классам финального действия; рядом accuracy и матрица ошибок; незавершённые кейсы не входят и считаются отдельно
    unit: доля
    level: [корзина]
    needs: эталонный класс кейса, журнал инструментов
    params:
      # Выполненный вызов какого инструмента означает класс. Без таких вызовов при обычном завершении — инструкция оператору.
      # Для запроса информации у клиента в tools/list стенда инструмента нет: такой финал пока распознаётся как инструкция оператору.
      classes:
        close_answer: [get_close_with_answer]
        expertise: [create_expertise]
        request_info: []
        operator_instruction: []
    version: v1
  - id: tools-f1
    builtin: tools-f1
    title: F1 инструментов
    description: F1 вызовов по минимально достаточному набору эталона, без учёта порядка, с правилом дубликатов
    unit: доля
    level: [кейс, корзина]
    needs: эталонный набор инструментов кейса
    params:
      # tolerate: до maxRepeats вызовов одного инструмента считаются одним, каждый следующий — FP («≤3 допустимо, с 4-го — FP»).
      # strict: формула аналитика без схлопывания — каждый вызов сверх эталона FP. whole: сверх допустимого весь инструмент — FP.
      duplicates: tolerate
      maxRepeats: 3
      # Инструменты, которые не считаются ни верными, ни лишними.
      ignore: []
    version: v1
  - id: answer-match
    builtin: answer-match
    title: A_judge · Соответствие эталону
    description: LLM-судья сравнивает итоговый текст агента с эталонным; несколько независимых прогонов, среднее
    unit: доля
    level: [кейс, корзина]
    needs: эталонный итоговый текст, модель оценки
    params:
      runs: 3
      # Откуда брать итоговый текст по классу: первое непустое поле аргументов итогового вызова.
      # Для классов без путей — последняя реплика агента.
      text:
        close_answer: [request.extendedAnswer, request.shortAnswer]
        expertise: [request.expertiseDescription]
    version: v1
  - id: case-score
    builtin: case-score
    title: M2 · Качество внутри сценария
    description: Среднее по кейсам case_score = w_tools · F1_tools + w_answer · A_judge
    unit: доля
    level: [кейс, корзина]
    needs: F1 инструментов и A_judge
    params:
      # Стартовые веса аналитика; если важнее ответ клиенту — 0.4 и 0.6. Сумма — 1.
      weights: { tools: 0.5, answer: 0.5 }
    version: v1
