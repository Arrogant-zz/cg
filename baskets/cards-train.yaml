id: cards-train
title: Обучение · блокировки и перевыпуск карт
type: training
description: Два кейса, три сценария помощи. Curator каждые 2 завершённых решения и финальный проход неполной пачки.
curator:
  every: 2
  final: true
  resetBefore: true
items:
  - solution: card-blocked-wrong-pin/explain-now
  - solution: card-reissue-lost/explain-now
  - solution: card-blocked-wrong-pin/explain-on-ask
  - solution: card-reissue-lost/explain-on-ask
  - solution: card-blocked-wrong-pin/minimal
  - solution: card-reissue-lost/minimal
