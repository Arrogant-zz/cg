case: card-hold-amount
title: «Объясняет сразу»
goal: перестанет ли агент выставлять экспертизу по блокировке суммы, если правило объяснили сразу.
operator:
  style: explain-now
  instruction: >
    Отклоняй действия, которые расходятся с эталоном, и сразу объясняй правило. Если ответ клиенту неполный, скажи, что добавить, и объясни почему.
