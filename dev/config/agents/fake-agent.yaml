# Локальная заглушка агента из dev/fake-agent для демо и тестов.
# Запрос и ответ — в формате AEFClaw (agents/aef-claw.yaml); отличие — в ответе есть счётчик токенов.
# Как у AEFClaw, скиллы живут внутри агента у тестового оператора: новый начинает со стартовых скиллов сборки (dev/fake-agent/build).
id: fake-agent
title: fake-agent · локально
request:
  url: ${env:FAKE_AGENT_URL:-http://127.0.0.1:8091}/a2a
  method: POST
  headers:
    a2a-version: "1.0"
  body: templates/aefclaw-a2a-message.json
  taskIdHeader: x-task-id
  senderIdHeader: X-A2A-Sender-Id
  taskIdScope: execution
response:
  mode: sync
  replyPath: $.result.task.status.message.parts[*].text
  statusPath: $.result.task.status.state
  errorPath: $.error.message
  usage:
    inputPath: $.result.task.metadata.usage.input_tokens
    outputPath: $.result.task.metadata.usage.output_tokens
commands:
  capture: /case-capture request_ref={{taskId}} category={{topic}}
mcp:
  contract: contracts/tools.json
# Метка модели для снимка прогона: fake-agent — сценарий на разговорнике, без LLM.
model: fake-agent (сценарий, без LLM)
sessions:
  max: 3
healthUrl: ${env:FAKE_AGENT_URL:-http://127.0.0.1:8091}/health
build: fake-agent 0.2
learningKit: learning-scripts (имитация)
